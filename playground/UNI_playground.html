<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI Playground — 全母国語プログラミング言語</title>
<style>
:root{
  --paper:#EDF0F2; --panel:#FFFFFF; --ink:#1F262E; --line:#D6DCE1;
  --kw:#274C9A;      /* 瑠璃: キーワード */
  --var:#B4362E;     /* 茜: 「変数 */
  --param:#B26A00;   /* 琥珀: ￥引数 */
  --str:#3D7A46;     /* 苔: ’文字列’ */
  --fn:#6D4FA1;      /* 菫: ひらがな関数・動詞 */
  --mk:#4A6070;      /* 鈍: マーカー */
  --cm:#8A939E;      /* 灰: コメント */
  --num:#0F6B6B;     /* 青碧: 数値 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
header{padding:26px 32px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:600;font-size:34px;letter-spacing:.14em;line-height:1}
h1 .uni-src{font-size:15px;letter-spacing:0;margin-left:18px;vertical-align:middle;
  font-family:ui-monospace,"SF Mono",Consolas,"Hiragino Kaku Gothic ProN",monospace}
.sub{margin-top:8px;font-size:13px;color:var(--mk)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{font-weight:600}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
@media (max-width:880px){main{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;min-height:340px}
.pane-l{border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar label{font-size:12px;color:var(--mk)}
select,button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
button.run{background:var(--kw);color:#fff;border-color:var(--kw)}
button.run:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
.editor-wrap{position:relative;flex:1;min-height:0}
.hl,textarea{position:absolute;inset:0;padding:16px;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,"SF Mono",Consolas,"Hiragino Kaku Gothic ProN",monospace;
  font-size:15px;line-height:1.75;letter-spacing:.02em}
.hl{overflow:auto;pointer-events:none;color:var(--ink)}
textarea{resize:none;border:0;background:transparent;color:transparent;caret-color:var(--ink);overflow:auto}
textarea:focus{outline:none}
.tK{color:var(--kw);font-weight:700}.tV{color:var(--var)}.tP{color:var(--param);font-weight:600}
.tS{color:var(--str)}.tF{color:var(--fn)}.tM{color:var(--mk)}.tC{color:var(--cm)}.tN{color:var(--num)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:10px 16px 8px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mk)}
.tab small{display:block;font-size:10px;color:var(--cm)}
.tab.on{color:var(--ink);border-bottom-color:var(--kw);font-weight:600}
.out{flex:1;overflow:auto;padding:16px;background:var(--panel);
  font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.errors{border-top:1px solid var(--line);background:#FBF3F2;color:#7C2D26;
  padding:10px 16px;font-size:13px;white-space:pre-wrap;display:none;max-height:130px;overflow:auto}
.errors.show{display:block}
footer{padding:10px 32px;border-top:1px solid var(--line);font-size:12px;color:var(--mk);background:var(--panel)}
@media (prefers-reduced-motion:no-preference){.tab{transition:border-color .15s,color .15s}}
</style>
</head>
<body>
<header>
  <h1>UNI<span class="uni-src"><span class="tS">’うに’</span> <span class="tF">出す</span><span class="tM">。</span></span></h1>
  <div class="sub">全母国語プログラミング言語 — 書いた瞬間、4つの言語になる。IME切り替えは一度も要らない。</div>
  <div class="legend">
    <span><b class="tV">「</b>=変数</span>
    <span><b class="tP">￥「</b>=引数</span>
    <span><b class="tF">ひらがな</b>=関数・動詞</span>
    <span><b class="tK">全角大文字</b>=制御</span>
    <span><b class="tS">’…’</b>=文字列</span>
    <span><b class="tC">・・</b>=コメント</span>
    <span>一文字目だけで品詞が決まる文法</span>
  </div>
</header>
<main>
  <section class="pane pane-l" aria-label="UNIソース">
    <div class="bar">
      <label for="sample">サンプル</label>
      <select id="sample">
        <option value="hello">こんにちは世界</option>
        <option value="kansu">関数とループ</option>
        <option value="list">リストと辞書</option>
        <option value="seiseki" selected>成績管理(中規模)</option>
        <option value="v05">v0.5新構文(入れ子・剰余ほか)</option>
      </select>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--cm)">日本語入力のままどうぞ</span>
    </div>
    <div class="editor-wrap">
      <div class="hl" id="hl" aria-hidden="true"></div>
      <textarea id="src" spellcheck="false" aria-label="UNIソースコード"></textarea>
    </div>
    <div class="errors" id="errors" role="alert"></div>
  </section>
  <section class="pane" aria-label="変換結果">
    <div class="tabs" role="tablist">
      <div class="tab on" data-t="py" role="tab">Python<small>print</small></div>
      <div class="tab" data-t="php" role="tab">PHP<small>echo</small></div>
      <div class="tab" data-t="js" role="tab">JavaScript<small>console.log</small></div>
      <div class="tab" data-t="java" role="tab">Java<small>System.out.println</small></div>
      <div class="tab" data-t="doc" role="tab">文法書<small>v0.5 全記載</small></div>
    </div>
    <div class="bar">
      <span style="font-size:12px;color:var(--cm)">同じ中立ASTからの投影</span>
      <span style="flex:1"></span>
      <button class="run" id="run">JavaScriptを実行</button>
    </div>
    <div class="out" id="out"></div>
  </section>
</main>
<footer>UNI 文法コアv0.5 — パーサはターゲットを知らない。対応表1枚で母国語が増える。</footer>

<script>
'use strict';
/* ================= UNI トランスパイラ(uni.py v0.4 のJS移植) ================= */
const PROTECT = '、。「」’￥；';
function normalize(src){
  let out='';
  for(const ch of src) out += PROTECT.includes(ch) ? ch : ch.normalize('NFKC');
  out = out.replace(/¥/g,'￥').replace(/[−－]/g,'-');
  const KD={'〇':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};
  const kconv=w=>{w=[...w].map(c=>KD[c]??c).join('');
    w=w.replace(/(\d)十(\d)/g,'$1$2').replace(/(\d)十/g,'$10').replace(/十(\d)/g,'1$1').replace(/十/g,'10');return w;};
  out = out.replace(/[〇一二三四五六七八九十]+(?=(?:個|つ|番)目)/g,kconv);
  out = out.replace(/(?<![\u3040-\u30FF\u4E00-\u9FFF])[〇一二三四五六七八九十]+(?![\u3040-\u30FF\u4E00-\u9FFF])/g,kconv);
  return out;
}
function stripComment(line){
  let out='',inS=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='’') inS=!inS;
    if(!inS && (line.slice(i,i+2)==='・・'||line.slice(i,i+2)==='//')) break;
    out+=line[i];
  }
  return out;
}
function splitStatements(line){
  const st=[];let buf='',inS=false;
  for(const ch of line){
    if(ch==='’'){inS=!inS;buf+=ch;}
    else if(ch==='。'&&!inS){if(buf.trim())st.push(buf.trim());buf='';}
    else buf+=ch;
  }
  if(buf.trim())st.push(buf.trim());
  return st;
}
const CMP=[['より大きい','>'],['より小さい','<'],['以上','>='],['以下','<='],['とおなじ','=='],['と同じ','=='],['とちがう','!='],['と違う','!=']];
const OPS={'足す':'+=','たす':'+=','引く':'-=','ひく':'-=','掛ける':'*=','かける':'*=','割る':'/=','わる':'/='};
const ORD='(?:つ|個|番)目';
function splitLLItems(body){
  const items=[];let buf='',depth=0,inS=false,i=0;
  while(i<body.length){
    const ch=body[i];
    if(ch==='’')inS=!inS;
    if(!inS){
      if(body.slice(i,i+2).toUpperCase()==='LL'&&!(/[A-Za-z0-9]/.test(body[i+2]||''))){depth++;buf+=body.slice(i,i+2);i+=2;continue;}
      if(ch==='」'){depth--;buf+=ch;i++;continue;}
      if(ch==='、'&&depth===0){items.push(buf);buf='';i++;continue;}
    }
    buf+=ch;i++;
  }
  if(buf.trim())items.push(buf);
  return items;
}
function llValue(tok){
  const t=tok.trim();
  if(/^LL(\s|[^A-Za-z0-9]|$)/i.test(t)){
    const inner=t.replace(/^LL\s*/i,'').replace(/」\s*$/,'');
    if(/[；;]/.test(inner)){
      const pairs=[];
      for(const p of splitLLItems(inner)){
        if(!p.trim())continue;
        const idx=p.search(/[；;]/);
        pairs.push([datum(p.slice(0,idx)),llValue(p.slice(idx+1))]);
      }
      return ['dictval',pairs];
    }
    return ['listval',splitLLItems(inner).filter(p=>p.trim()).map(p=>llValue(p))];
  }
  return datum(t);
}
function atom(tok){
  tok=tok.trim();
  let mc=tok.match(new RegExp('^「(\\S+?)((?:\\s*\\d+(?:つ|個|番)目){2,})$'));
  if(mc){
    const idxs=[...mc[2].matchAll(/(\d+)(?:つ|個|番)目/g)].map(x=>parseInt(x[1])-1);
    return ['idxchain',mc[1],idxs];
  }
  if(tok.startsWith('’')&&tok.endsWith('’')){
    const c=tok.slice(1,-1);
    if(c.includes('「')&&c.includes('」')){
      const parts=c.split(/「([^\s」]+?)」/);
      const segs=[];
      parts.forEach((p,i)=>{if(p!=='')segs.push(i%2?['var',p]:['txt',p]);});
      return ['fstr',segs];
    }
    return ['str',c];
  }
  if(tok==='ヌル'||tok==='ﾇﾙ')return ['null'];
  let m=tok.match(new RegExp('^「(\\S+?)\\s*(\\d+)'+ORD+'$'));
  if(m)return ['idx',m[1],parseInt(m[2])-1];
  m=tok.match(/^「(\S+?)\s+(\S+)$/);
  if(m)return ['key',m[1],datum(m[2])];
  if(tok.startsWith('「'))return ['var',tok.slice(1)];
  if(/^-?\d+(\.\d+)?$/.test(tok))return ['num',tok];
  return ['raw',tok];
}
function datum(tok){const a=atom(tok);return a[0]==='raw'?['str',a[1]]:a;}
const MSG={
 ja:{for_no_range:'FOR文には「(リスト)から」か「(終値)まで」のどちらかが必要です',
     for_no_start:'FOR文の開始値が見つかりません(例: FOR 1 「Iが3まで)',
     for_no_var:'FOR文のループ変数「〇〇が」が見つかりません',
     bad_stmt:'この文を解釈できません。関数名はひらがな、変数は「で始めてください',
     no_use:'PlaygroundではUSE(ファイル取込)は使えません',
     header:(l,m,s)=>`【${l}行目】${m}\n  → ${s}`},
 en:{for_no_range:'FOR needs either "from (list)" or "to (end value)"',
     for_no_start:'FOR start value not found',
     for_no_var:'FOR loop variable not found',
     bad_stmt:'Cannot parse this statement',
     no_use:'USE is not available in the playground',
     header:(l,m,s)=>`[line ${l}] ${m}\n  -> ${s}`},
};
class UniErr extends Error{constructor(key){super(key);this.key=key;}}
class Parser{
  constructor(lang='ja'){this.lastVar=null;this.colls=new Set();this.ir=[];this.lang=lang;this.errors=[];}
  put(d,n){this.ir.push([d,n]);}
  cond(body){
    if(body.includes('または'))return ['logic','or',body.split('または').map(p=>this.cond(p))];
    if(body.includes('かつ'))return ['logic','and',body.split('かつ').map(p=>this.cond(p))];
    body=body.trim();
    if(body.endsWith('でない'))return ['not',this.cond(body.slice(0,-3))];
    for(const [jp,op] of CMP){
      if(body.includes(jp)){
        const left=body.split(jp)[0];
        const m=left.match(/(「\S+?|’[^’]*’)?\s*(\S+)\s*$/);
        const l=m[1]?atom(m[1]):['var',this.lastVar];
        return ['cmp',l,op,atom(m[2])];
      }
    }
    return atom(body);
  }
  stmt(s,depth){
    s=s.trim().replace(/\{+\s*$/,'').trim();
    if(!s||s==='}')return [depth,0];
    let m=s.match(/^定義\s+(\S+?)((?:\s+￥「\S+)*)\s*$/);
    if(m){
      const params=[...m[2].matchAll(/￥「(\S+)/g)].map(x=>x[1]);
      this.put(depth,['def',m[1],params]);return [depth,1];
    }
    if(/^USE\b/i.test(s))throw new UniErr('no_use');
    if(/^BREAK$/i.test(s)){this.put(depth,['break']);return [depth,0];}
    if(/^CONTINUE$/i.test(s)){this.put(depth,['continue']);return [depth,0];}
    if(/^TRY$/i.test(s)){this.put(depth,['try']);return [depth,1];}
    if(/^CATCH$/i.test(s)){this.put(depth,['catch']);return [depth,1];}
    if(/^FOR\b/i.test(s)&&!s.includes('まで')){
      const lst=s.match(/「([^「\s]+?)\s*から/);
      if(!lst)throw new UniErr('for_no_range');
      const v=s.match(/「([^「\s]+?)が/);
      const step=s.match(/(\d+)ずつ/);
      const vv=v?v[1]:'それ';
      this.put(depth,['foreach',vv,lst[1],step?parseInt(step[1]):1]);
      this.lastVar=vv;return [depth,1];
    }
    if(/^FOR\b/i.test(s)){
      const v=s.match(/「([^「\s]+?)が/);
      if(!v)throw new UniErr('for_no_var');
      const sEnd=s.replace(/「[^「\s]+?が/g,'');
      const end=sEnd.match(/(「[^「\s]+?|\d+)まで/);
      if(!end)throw new UniErr('for_no_range');
      const step=s.match(/(\d+)ずつ/);
      const down=s.includes('へる');
      const rest=s.replace(/「[^「\s]+?が/g,'').replace(/(「[^「\s]+?|\d+)まで/g,'').replace(/\d+ずつ(ふえる|へる)?/g,'').replace(/ふえる|へる/g,'').replace(/^FOR/i,'');
      const start=rest.match(/\d+/);
      if(!start)throw new UniErr('for_no_start');
      this.put(depth,['forrange',v[1],start[0],atom(end[1]),step?step[1]:'1',down]);
      return [depth,1];
    }
    if(/^ELSE\s+IF\b/i.test(s)){this.put(depth,['elif',this.cond(s.replace(/^ELSE\s+IF\s*/i,''))]);return [depth,1];}
    if(/^ELSE\b/i.test(s)){this.put(depth,['else']);return [depth,1];}
    if(/^WHILE\b/i.test(s)){this.put(depth,['while',this.cond(s.replace(/^WHILE\s*/i,''))]);return [depth,1];}
    if(/^IF\b/i.test(s)){this.put(depth,['if',this.cond(s.replace(/^IF\s*/i,''))]);return [depth,1];}
    m=s.match(/^「(\S+?)\s*=\s*(.+)$/);
    if(m){
      const name=m[1],rhs=m[2].trim();
      const mex=rhs.match(/^EX\s*’([^’]+)’(?:\s*、(.*))?$/i);
      if(mex){
        const args=mex[2]?mex[2].split('、').map(p=>atom(p)):[];
        this.put(depth,['assignext',name,mex[1],args]);this.lastVar=name;return [depth,0];
      }
      const mll=rhs.match(/^LL(?:\s+|(?=[^A-Za-z0-9])|$)(.*)$/is);
      if(mll&&(/[；;]/.test(mll[1]))){
        const pairs=[];
        for(const p of splitLLItems(mll[1])){
          if(!p.trim())continue;
          const i=p.search(/[；;]/);
          pairs.push([datum(p.slice(0,i)),llValue(p.slice(i+1))]);
        }
        this.put(depth,['dictlit',name,pairs]);this.colls.add(name);
      }else if(mll){
        const items=splitLLItems(mll[1]).filter(p=>p.trim()).map(p=>llValue(p));
        this.put(depth,['listlit',name,items]);this.colls.add(name);
      }else{
        const parts=rhs.split('、').map(p=>p.trim());
        if(parts.length>1)this.put(depth,['assigncall',name,parts[0],parts.slice(1).map(p=>atom(p))]);
        else if(/^[ぁ-ゖー]+$/.test(rhs))this.put(depth,['assigncall',name,rhs,[]]);
        else this.put(depth,['assign',name,atom(rhs)]);
      }
      this.lastVar=name;return [depth,0];
    }
    m=s.match(/^「(\S+?)\s+(\S+)\s*から$/);
    if(m){this.put(depth,['assign',m[1],atom(m[2])]);this.lastVar=m[1];return [depth,0];}
    m=s.match(/^「(\S+?)(から)?$/);
    if(m&&!['足す','渡す','出す','消す','かえる'].some(v=>s.includes(v))){
      this.put(depth,['assign',m[1],['num','0']]);this.lastVar=m[1];return [depth,0];
    }
    m=s.match(new RegExp('^「(\\S+?)\\s+(\\d+)'+ORD+'\\s+(\\S+)\\s+かえる$'));
    if(m){this.put(depth,['setidx',m[1],parseInt(m[2])-1,datum(m[3])]);return [depth,0];}
    m=s.match(new RegExp('^「(\\S+?)\\s+(\\S+?)\\s+(?:(\\d+)'+ORD+'\\s+)?(\\S+)\\s+かえる$'));
    if(m){this.put(depth,['setkey',m[1],datum(m[2]),datum(m[4])]);return [depth,0];}
    m=s.match(new RegExp('^「(\\S+?)\\s+(\\d+)'+ORD+'\\s+消す\\s+(左|ヌル)$'));
    if(m){this.put(depth,[m[3]==='左'?'delshift':'delnull',m[1],parseInt(m[2])-1]);return [depth,0];}
    const s2=s.replace(/^「(\S+?)に\s*/,'「$1 ');
    m=s2.match(/^(「\S+\s+)?(\S+?)\s*(ずつ)?(足す|たす|引く|ひく|掛ける|かける|割る|わる)$/);
    if(m){
      const target=m[1]?m[1].trim().slice(1):this.lastVar;
      if(this.colls.has(target)&&(m[4]==='足す'||m[4]==='たす'))
        this.put(depth,['append',target,datum(m[2])]);
      else this.put(depth,['aug',target,OPS[m[4]],atom(m[2])]);
      return [depth,0];
    }
    m=s.match(/^(最後に)?\s*「?(\S+?)\s*渡す$/);
    if(m){this.put(depth,['return',['var',m[2]]]);return [depth,0];}
    m=s.match(/^(.+?)\s*出す$/);
    if(m){this.put(depth,['print',atom(m[1])]);return [depth,0];}
    const mex=s.match(/^EX\s*’([^’]+)’(?:\s*、(.*))?$/i);
    if(mex){
      const args=mex[2]?mex[2].split('、').map(p=>atom(p)):[];
      this.put(depth,['externcall',mex[1],args]);return [depth,0];
    }
    const parts=s.split('、').map(p=>p.trim());
    if(!/^[ぁ-ゖー]+$/.test(parts[0]))throw new UniErr('bad_stmt');
    this.put(depth,['call',parts[0],parts.slice(1).map(p=>atom(p))]);
    return [depth,0];
  }
  parse(src){
    src=normalize(src);
    const indents=[0];let depth=0,pending=0;
    const lines=src.split('\n');
    for(let li=0;li<lines.length;li++){
      const raw=lines[li];
      if(!stripComment(raw).trim())continue;
      const ind=raw.length-raw.replace(/^[\u3000 \t]+/,'').length;
      if(pending){indents.push(ind);depth+=pending;pending=0;}
      else{while(indents.length>1&&ind<indents[indents.length-1]){indents.pop();depth--;}}
      for(const st of splitStatements(stripComment(raw.trim()))){
        try{
          const [d,o]=this.stmt(st,depth);depth=d;pending+=o;
        }catch(e){
          const T=MSG[this.lang];
          const key=(e instanceof UniErr)?e.key:'bad_stmt';
          this.errors.push(T.header(li+1,T[key],st));
        }
      }
    }
    return [this.ir,this.colls];
  }
}
/* ---------- バックエンド共通ヘルパ ---------- */
function esc(s){return s.replace(/"/g,'\\"');}
function tplCall(tpl,rendered){
  if(tpl.includes('{a0}')){rendered.forEach((r,i)=>{tpl=tpl.split('{a'+i+'}').join(r);});return tpl;}
  return tpl.split('{a}').join(rendered.join(', '));
}
/* ---------- Python ---------- */

      else if(k==='assign')o.push(`${pad}${decl(n[1])}${n[1]} = ${this.e(n[2],t)};`);
      else if(k==='assigncall')o.push(`${pad}${decl(n[1])}${n[1]} = ${this.fcall(n[2],n[3],t)};`);
      else if(k==='assignext')o.push(`${pad}${decl(n[1])}${n[1]} = ${n[2]}(${n[3].map(x=>this.e(x,t)).join(', ')});`);
      else if(k==='externcall')o.push(`${pad}${n[1]}(${n[2].map(x=>this.e(x,t)).join(', ')});`);
      else if(k==='listlit'){const items=n[2].map(x=>this.e(x,t)).join(', ');
        o.push(items?`${pad}${decl(n[1])}${n[1]} = new ArrayList<>(Arrays.asList(${items}));`
                    :`${pad}${decl(n[1])}${n[1]} = new ArrayList<>();`);}
      else if(k==='dictlit'){o.push(`${pad}${decl(n[1])}${n[1]} = new LinkedHashMap<>();`);
        for(const [kk,vv] of n[2])o.push(`${pad}${n[1]}.put(${this.e(kk,t)}, ${this.e(vv,t)});`);}
      else if(k==='setidx')o.push(`${pad}${n[1]}.set(${n[2]}, ${this.e(n[3],t)});`);
      else if(k==='setkey')o.push(`${pad}${n[1]}.put(${this.e(n[2],t)}, ${this.e(n[3],t)});`);
      else if(k==='delshift')o.push(`${pad}${n[1]}.remove(${n[2]});`);
      else if(k==='delnull')o.push(`${pad}${n[1]}.set(${n[2]}, null);`);
      else if(k==='append')o.push(`${pad}${n[1]}.add(${this.e(n[2],t)});`);
      else if(k==='aug'){let sv=this.e(n[3],t);
        if(n[3][0]==='var'&&t[n[3][1]]==='Object')sv=`((Number)${sv}).doubleValue()`;
        o.push(`${pad}${n[1]} ${n[2]} ${sv};`);}
      else if(k==='return')o.push(`${pad}return ${this.e(n[1],t)};`);
      else if(k==='print')o.push(`${pad}System.out.println(${this.e(n[1],t)});`);
      else if(k==='call')o.push(`${pad}${this.fcall(n[1],n[2],t)};`);
      else if(k==='break')o.push(`${pad}break;`);
      else if(k==='continue')o.push(`${pad}continue;`);
      else if(k==='try')o.push(`${pad}try {`);
      else if(k==='catch')o.push(`${pad}catch (Exception ex) {`);
      if(opens)stack.push(depth);
    }
    closeTo(0);
    if(buf)funcs.push(buf);
    const body=['import java.util.*;','public class Main {','    static Scanner SC = new Scanner(System.in);'];
    funcs.forEach(f=>body.push(...f));
    body.push('    public static void main(String[] args) {');
    main.forEach(l=>body.push('    '+l));
    body.push('    }','}');
    let code=body.join('\n');
    code=code.replace(/\}\n(\s*)elif_MARK/g,'} else if').replace(/\}\n(\s*)else \{/g,'} else {').replace(/\}\n(\s*)catch/g,'} catch');
    return code;
  }
}

const el=id=>document.getElementById(id);
const KW=/^(FOR|IF|ELSE|WHILE|TRY|CATCH|BREAK|CONTINUE|LL|EX|USE)$/i;
const VERBS=['最後に','より大きい','より小さい','以上','以下','と同じ','とちがう','足す','たす','引く','ひく','掛ける','かける','割る','わる','渡す','出す','かえる','消す','ふえる','へる','かつ','または','でない','から','まで','ずつ','きく','ながさ','へいほうこん','ヌル','個目','つ目','番目','定義'];
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlight(src){
  return src.split('\n').map(line=>{
    let out='',i=0,inC=false;
    while(i<line.length){
      const rest=line.slice(i);
      if(rest.startsWith('・・')||rest.startsWith('//')){out+=`<span class="tC">${escapeHtml(rest)}</span>`;break;}
      if(line[i]==='’'){
        const j=line.indexOf('’',i+1);
        const seg=j<0?line.slice(i):line.slice(i,j+1);
        out+=`<span class="tS">${escapeHtml(seg)}</span>`;i+=seg.length;continue;
      }
      if(rest.startsWith('￥「')){
        const m=rest.match(/^￥「[^\s＝、。｛｝；’」=]+/);
        out+=`<span class="tP">${escapeHtml(m[0])}</span>`;i+=m[0].length;continue;
      }
      if(line[i]==='「'){
        const m=rest.match(/^「[^\s＝、。｛｝；’」=]+/);
        const seg=m?m[0]:'「';
        out+=`<span class="tV">${escapeHtml(seg)}</span>`;i+=seg.length;continue;
      }
      let matched=false;
      const wm=rest.match(/^[A-Za-zＡ-Ｚａ-ｚ]+/);
      if(wm&&KW.test(wm[0].normalize('NFKC'))){
        out+=`<span class="tK">${escapeHtml(wm[0])}</span>`;i+=wm[0].length;continue;
      }
      for(const v of VERBS){
        if(rest.startsWith(v)){out+=`<span class="${v==='定義'?'tK':'tF'}">${escapeHtml(v)}</span>`;i+=v.length;matched=true;break;}
      }
      if(matched)continue;
      const nm=rest.match(/^[-−0-9０-９][0-9０-９.．]*/);
      if(nm){out+=`<span class="tN">${escapeHtml(nm[0])}</span>`;i+=nm[0].length;continue;}
      out+=escapeHtml(line[i]);i++;
    }
    return out;
  }).join('\n')+'\n';
}
let currentTab='py',lastCodes={};
function transpileAll(){
  const src=el('src').value;
  el('hl').innerHTML=highlight(src);
  const results={};let errors=[];
  for(const tgt of ['py','php','js','java']){
    const p=new Parser('ja');
    const [ir,colls]=p.parse(src);
    if(p.errors.length){errors=p.errors;results[tgt]='';continue;}
    try{
      const B={py:PyB,php:PhpB,js:JsB,java:JavaB}[tgt];
      results[tgt]=new B(colls).render(ir);
    }catch(e){results[tgt]='(生成エラー: '+e.message+')';}
  }
  lastCodes=results;
  const errBox=el('errors');
  if(errors.length){errBox.textContent=errors.join('\n');errBox.classList.add('show');}
  else errBox.classList.remove('show');
  showTab(currentTab);
}
function showTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  if(t==='doc'){el('out').innerHTML=GRAMMAR;return;}
  el('out').textContent=lastCodes[t]||'';
}
function runJs(){
  const code=lastCodes.js;
  if(!code){el('out').textContent='(変換エラーのため実行できません)';return;}
  const logs=[];
  const fakeConsole={log:(...a)=>logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))};
  const fakeRequire=()=>({readFileSync:()=>(prompt('きく：入力してください')??'')});
  try{new Function('console','require',code)(fakeConsole,fakeRequire);}
  catch(e){logs.push('実行時エラー: '+e.message);}
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  el('out').textContent='── 実行結果(JavaScript) ──\n'+(logs.join('\n')||'(出力なし)');
}
document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>showTab(x.dataset.t)));
el('run').addEventListener('click',runJs);
